name: Notify on scrape failure

# Listens for any scrape workflow's completion. If it failed, opens a
# GitHub Issue (or comments on the existing open one) so Mark gets the
# usual GitHub notification path (mobile push / email / web) without
# having to babysit Actions. Auto-closes the issue on a subsequent
# successful run of the same workflow.
#
# Why this and not GitHub's built-in "Notify me when workflows fail"?
# That setting is on by default but the notification is buried alongside
# every other Actions event; this surfaces failures as actionable
# Issues that stay open until acknowledged.

on:
  workflow_run:
    workflows:
      - "Scrape listings"
      - "Scrape auctions"
      - "Scrape auction lots (frequent)"
      - "Scrape eBay"
      - "Scrape Tropical Watch only"
      - "Rollup listing events"
    types:
      - completed

permissions:
  issues: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update issue on failure / close on recovery
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.payload.workflow_run;
            const wfName = wf.name;
            const conclusion = wf.conclusion;
            const runUrl = wf.html_url;
            const runId = wf.id;
            const sha = wf.head_sha.slice(0, 7);
            const at = wf.updated_at;
            const titlePrefix = `[scrape-fail] ${wfName}`;

            // Find an open issue we previously created for this workflow.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scrape-failure',
              per_page: 50,
            });
            const existing = openIssues.find((i) => i.title.startsWith(titlePrefix));

            if (conclusion === 'failure') {
              const body = `Workflow **${wfName}** failed on \`${sha}\` at ${at}.\n\n` +
                           `Run: ${runUrl}\n\n` +
                           `Triggered: ${wf.event}\n` +
                           `Run ID: ${runId}\n\n` +
                           `_Auto-opened by notify-scrape-failure workflow. ` +
                           `This issue will auto-close when ${wfName} runs successfully again._`;
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                console.log(`Commented on existing issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `${titlePrefix} — ${sha}`,
                  body,
                  labels: ['scrape-failure'],
                });
                console.log(`Opened new issue #${created.data.number}`);
              }
            } else if (conclusion === 'success' && existing) {
              // Recovery path — close the open failure issue.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered: ${wfName} succeeded on \`${sha}\` at ${at}. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Closed recovered issue #${existing.number}`);
            } else {
              console.log(`No action for conclusion=${conclusion} (no existing open issue)`);
            }
