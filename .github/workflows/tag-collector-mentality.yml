name: Tag collector-mentality articles (Lumé)

# Classifies editorial articles as "collector mentality" coaching content
# (scripts/tag_collector_mentality.py) → public/collector_mentality_tags.json.
# Claude Haiku, batched; ~$1-2 for the whole editorial pool. Runs in CI so it
# uses the ANTHROPIC_API_KEY secret — never a local key. Commits the tag index
# back to the branch it's dispatched on (so it lands in a PR, gated by CI —
# not pushed unguarded to main).
#
# Trigger: Actions tab → this workflow → Run workflow (pick the branch).
# Run with dry_run: yes first to size it (no API spend), then dry_run: no.

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles to classify (cost cap)"
        required: true
        default: "10000"
      model:
        description: "Anthropic model (haiku = cheapest)"
        required: false
        default: "claude-haiku-4-5"
      dry_run:
        description: "Size only, no API spend"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned deps
        run: pip install -r requirements-ai.txt
      - name: Tag collector-mentality articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MENTALITY_MODEL: ${{ github.event.inputs.model }}
        run: |
          python scripts/tag_collector_mentality.py \
            --max-articles ${{ github.event.inputs.max_articles }} \
            ${{ github.event.inputs.dry_run == 'yes' && '--dry-run' || '' }}
      - name: Commit tags
        if: ${{ github.event.inputs.dry_run != 'yes' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/collector_mentality_tags.json
          if git diff --cached --quiet; then
            echo "No tag changes."
          else
            git commit -m "Tag collector-mentality articles (max_articles=${{ github.event.inputs.max_articles }})"
            git push
          fi
