# Saved-watch reference synthesis — deepen Lumé's knowledge of the model lines
# users have SAVED. Manual-only (spends Anthropic credit), cost-capped.
#
# Stage 0 (build_saved_node_corpus.py): read saved watches from Supabase →
#   distinct nodes → AUTO-assemble each node's corpus from the existing editorial
#   corpus (reuses URLs we already hold) → reference_sources/<slug>.json + a slug
#   list. Skips already-synthesised (Submariner/Speedmaster) + thin nodes.
# Stage 1 (reference_corpus_scraper.py): build public/reference_corpus_<slug>.json
#   (reuses bodies — fetches nothing for auto-manifests).
# Stage 2 (reference_synthesis.py): ONE Opus pass per node → reference_synthesis_<slug>.json.
# Stage 3 (reference_digest.py): docs/reference_synthesis_<slug>.md for review.
#
# COST: ~$1–3 per node (Opus). `max_nodes` caps it; run with `dry_run: yes` first
# (manifests only, no Opus), then `max_nodes: 1` to validate one node before fan-out.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY (or _SERVICE_ROLE_KEY), ANTHROPIC_API_KEY.
name: Synthesise saved-watch nodes

on:
  workflow_dispatch:
    inputs:
      max_nodes:
        description: 'Max nodes to synthesise (Opus cost cap)'
        required: true
        default: '8'
      min_sources:
        description: 'Skip nodes with fewer than N source articles (raise to drop thin nodes)'
        required: true
        default: '4'
      dry_run:
        description: 'Build manifests only (no Opus synthesis)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

concurrency:
  group: saved-node-synthesis
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # B-44: this workflow used to push its synthesis outputs straight to
    # main with no test gate — on 2026-05-30 a new reference_synthesis_*.json
    # invalidated jest + pytest cases and turned main red with no warning.
    # Now it (1) runs both suites on the generated files and (2) opens a PR
    # instead of pushing to main. contents:write pushes the branch;
    # pull-requests:write lets `gh pr create` open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pipeline deps
        run: pip install -r requirements-pipeline.txt

      - name: Stage 0 — build saved-node manifests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python build_saved_node_corpus.py --max-nodes ${{ github.event.inputs.max_nodes }} --min-sources ${{ github.event.inputs.min_sources }}

      - name: Resolve slug list
        id: slugs
        run: |
          if [ -s reference_sources/_saved_slugs.txt ]; then
            echo "list=$(tr '\n' ' ' < reference_sources/_saved_slugs.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "list=" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage 1 — build reference corpus
        if: steps.slugs.outputs.list != ''
        run: python reference_corpus_scraper.py ${{ steps.slugs.outputs.list }}

      - name: Stage 2 — Opus synthesis
        if: ${{ steps.slugs.outputs.list != '' && github.event.inputs.dry_run != 'yes' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python reference_synthesis.py ${{ steps.slugs.outputs.list }}

      - name: Stage 3 — readable digest
        if: ${{ steps.slugs.outputs.list != '' && github.event.inputs.dry_run != 'yes' }}
        run: python reference_digest.py ${{ steps.slugs.outputs.list }}

      # B-44 gate: run BOTH suites on the freshly-generated files BEFORE we
      # commit anything. The 2026-05-30 breakage was a synthesis OUTPUT file
      # invalidating tests, so this must run after the stages, on the outputs.
      # If either suite fails, the job fails here and nothing is committed —
      # main can't go red. (We run the tests in-workflow rather than rely on
      # the PR's CI because a PR opened with the default GITHUB_TOKEN does NOT
      # trigger tests.yml — GitHub suppresses workflow-triggered pull_request
      # events to prevent recursion.)
      - name: Set up Node (test gate)
        if: steps.slugs.outputs.list != ''
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run test gate (pytest + jest) on generated outputs
        if: steps.slugs.outputs.list != ''
        run: |
          pip install -r requirements-dev.txt
          pytest
          npm install
          npm run test:ci

      - name: Commit + open PR
        if: steps.slugs.outputs.list != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference_sources/ \
                  public/reference_corpus_*.json \
                  public/reference_synthesis_*.json \
                  docs/reference_synthesis_*.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BRANCH="saved-node-synthesis/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Synthesise saved-watch nodes (max_nodes=${{ github.event.inputs.max_nodes }}) $STAMP"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Synthesise saved-watch nodes ($STAMP)" \
            --body "Automated saved-node synthesis fan-out (max_nodes=\`${{ github.event.inputs.max_nodes }}\`). pytest + jest already passed in-workflow against these files (B-44 gate). Review the digests under \`docs/reference_synthesis_*.md\`, then merge."
