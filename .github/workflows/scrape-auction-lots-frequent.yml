name: Scrape auction lots (frequent)

# Higher-frequency refresh of auction-lot data — current bids,
# starting-bid live status, sold/passed transitions. Reuses the
# comprehensive auction-lot scraper but skips the calendar walk
# and tracked-lots passes (those don't change as fast).
#
# Why a separate workflow: Mark report 2026-05-09 — auctions ending
# in EU timezone in the early-evening window were already showing
# stale state by mid-afternoon US time because the daily 06:00 UTC
# pass was the only refresh. Four runs per day (06:00 already
# covered by the main workflow, plus 12:00 / 16:00 / 20:00 here)
# means at most ~4-5 hours between refreshes during European /
# US-business-hours auction days.
#
# This workflow does NOT re-walk auction calendars (auctions.json)
# or eBay tracked lots — both of those are owned by the daily main
# workflow. It DOES re-run public/auction_lots.json AND
# public/loupethis_lots.json so the per-lot bid + status fields stay
# fresh for the active sale window.

on:
  schedule:
    # Four additional refreshes spaced through the day. The main
    # daily workflow at 06:00 UTC handles the morning pass; these
    # cover EU evening (~20:00 UTC) and US business hours.
    #
    # The 17:00 UTC pass exists specifically for Loupe This — every
    # lot ends in the 16:00–16:35 UTC window, daily. Without 17:00,
    # realised hammer prices wouldn't land until the 20:00 run, so
    # Mark would see a "Sold today USD 0" gap for ~4 hours after
    # close (Mark report 2026-05-15).
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

# Concurrency: don't double-run if a previous run hasn't finished.
# `cancel-in-progress: false` so we wait rather than abort an
# in-flight scrape.
concurrency:
  group: auction-lots-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        # curl-cffi is used by the Bonhams enumerator only — Cloudflare
        # on Bonhams blocks the plain `requests` library from GHA IPs
        # with a 403 because it checks TLS fingerprint (JA3), not just
        # HTTP headers. curl-cffi impersonates Chrome's real TLS hand-
        # shake so the same request from GHA clears the bot challenge.
        # Other houses (Antiquorum, Christie's, Sotheby's, Phillips,
        # Monaco Legend) continue to use plain `requests`.
        run: pip install -r requirements-auctions.txt

      - name: Run comprehensive auction-lot scraper
        # Reads the existing public/auctions.json (last refreshed by
        # the daily workflow) and re-scrapes per-lot data for active
        # sales. Output overwrites public/auction_lots.json. Soft-fail
        # so a single house going down doesn't kill the run.
        continue-on-error: true
        run: python auction_lots_scraper.py

      - name: Run Loupe This auction scraper
        # Independent of auction_lots_scraper — Loupe This has its own
        # API + own output file (public/loupethis_lots.json). Walks all
        # ~3.9k lots; ~3 min runtime. The 17:00 UTC slot is the close-
        # window catch (see schedule comment above).
        continue-on-error: true
        run: python loupethis_scraper.py

      - name: Set up Node (for image caching)
        # Same Node 22 pin as the main workflow — supabase-js boots
        # RealtimeClient unconditionally and Node 20 lacks native
        # WebSocket.
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Node deps
        run: npm install --omit=dev --no-audit --no-fund --prefer-offline

      - name: Cache watchlist images to Vercel Blob
        # Hearted auction-lot images can disappear once the lot ends —
        # this re-cache pass keeps Blob copies fresh for currently-
        # hearted lots. Same script as the daily run.
        #
        # timeout-minutes hard-caps the step (Mark report 2026-05-21):
        # this step started hanging indefinitely sometime after May 15,
        # blocking the Commit/push step downstream and starving the
        # cron of fresh bid data for ~6 days. continue-on-error: true
        # means the workflow proceeds even when the script times out;
        # the bid data still lands. Root-cause investigation of the
        # hang is a separate task.
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node cache_watchlist_images.mjs

      - name: Record per-house auction health (B-75)
        # Runs BEFORE the commit so the updated consecutive-empty counts in
        # data/auction_health_state.json get committed by `git add data/`.
        # Always exits 0 (the --check step below decides pass/fail).
        if: always()
        run: python3 auction_health.py --record

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Broad add, not a hand-listed set. A named list silently drops
          # any new output file nobody remembered to add here, and leaves
          # it unstaged — which is what made `git pull --rebase` refuse to
          # run and binned a month of editorial scrapes (#920). Same shape
          # as scrape-listings.yml.
          git add public/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auction lots refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing and retrying ($i/3)..."
            if ! git pull --rebase --autostash --strategy-option=theirs; then
              echo "Rebase failed, aborting and retrying push"
              git rebase --abort 2>/dev/null || true
            fi
          done
          echo "Push still failing after 3 retries"
          exit 1

      - name: Auction-health gate (B-75)
        # Runs LAST with always() — after the data is committed — so it can
        # red the job (→ notify-scrape-failure opens an issue) when a house
        # has a published catalog but 0 lots for THRESHOLD consecutive runs
        # (the Sotheby's / Christie's / Bonhams silent-zero failure mode).
        if: always()
        run: python3 auction_health.py --check
